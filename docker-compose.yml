services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: mytoolbox-backend

    env_file:
      - ./backend/.env

    environment:
      PORT: 8000

    restart: unless-stopped

    expose:
      - "8000"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        NEXT_PUBLIC_API_BASE: /api

    container_name: mytoolbox-frontend

    restart: unless-stopped

    depends_on:
      - backend

    expose:
      - "3000"


  nginx:
    image: nginx:alpine

    container_name: mytoolbox-nginx

    restart: unless-stopped

    depends_on:
      - frontend
      - backend

    ports:
      - "80:80"

    volumes:
      - ./nginx/mytoolbox.conf:/etc/nginx/conf.d/default.conf:ro